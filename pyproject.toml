[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sankalit-mcp"
version = "0.1.0"
description = "Document Intelligence MCP for Claude Desktop"
authors = [
    { name = "Sambhav Shah" }
]
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.0.0",
    "python-docx>=1.0.0",
    "pypdf>=4.0.0",
    "docx2pdf>=0.1.8",
    "jinja2>=3.0.0",
    "reportlab",
    "python-pptx",
    "openpyxl",
    "pillow"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sankalit-mcp = "sankalit_mcp.server:main"
